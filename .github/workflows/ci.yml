name: CI

# Every push to main and every pull request, so a commit is checked before a tag
# ever asks it to be released.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The whole repository, the demo and the config files included — the package
      # build below only type-checks what ships.
      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the package
        run: npm run build

      # Budgets, not notes: a bundle over one fails here rather than being noticed later.
      - name: Bundle size
        run: npm run size

      # Not shipped, but it is the first thing anyone sees, so it should not be broken.
      - name: Build the demo
        run: npm run build:demo
