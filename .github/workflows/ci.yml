name: CI

# Every push to main and every pull request, so a commit is checked before a tag
# ever asks it to be released.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # Type-checks the source as well as bundling it: the declaration build is
      # `tsc` over `src`, so a type error fails here rather than at release time.
      - name: Build the package
        run: npm run build

      # Not shipped, but it is the first thing anyone sees, so it should not be broken.
      - name: Build the demo
        run: npm run build:demo
